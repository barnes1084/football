; Gridiron North: default settings.
;
; Every value here is the setting's default: what a new player gets, and
; what RESET puts it back to. Change a number, save, and the next build
; uses it. A setting left out of this file uses the default in
; scripts/tune.gd. Values outside a setting's range are clamped.
;
; Tip: tune the game on your phone in the APK (developer settings), then
; tap COPY AS DEFAULTS in the settings and paste over this whole file.

[defaults]

; ---------- GAME ----------
; Difficulty ("easy", "normal", "hard"): how good the computer's players are
difficulty="normal"
; Game speed (0.4 to 2 ×)
gameSpeed=1
; Quarter length (1 to 15 min): game clock
quarterMinutes=4
; Clock speed during a play (0.5 to 6 ×)
clockRate=1.5
; Clock runs between plays (0 to 40 s): after a play that ends in bounds
runoff=18
; Computer snaps the ball after (1 to 10 s): time to pick and move your defender
snapDelay=3.5
; Pause after the whistle (0.5 to 5 s)
deadTime=1.8
; Season games (1 to 14): 7 = everyone plays everyone once; then the top two meet in the North Bowl
seasonGames=7
; Screen shake on big hits (0 to 3 ×)
shake=1
; Vibrate on tackles (true / false)
vibrate=true
; Sound effects volume (0 to 1, as a fraction: 0.01 = 1%)
sfxVolume=0.6
; Music volume (0 to 1, as a fraction: 0.01 = 1%)
musicVolume=0.25
; Crowd volume (0 to 1, as a fraction: 0.01 = 1%)
crowdVolume=0.35

; ---------- CONTROLS ----------
; Throw / juke / tackle with the right side, run with the left (true / false)
swapSides=false
; Move stick size (30 to 220 px)
stickSize=60
; Move stick dead zone (0 to 0.5, as a fraction: 0.01 = 1%)
stickDeadzone=0.08
; Tap tolerance (2 to 40 px): moves smaller than this are taps
tapSlop=12
; Pull length for the longest throw (0.1 to 0.8, as a fraction: 0.01 = 1%): share of the screen height
dragFull=0.32
; Shorter pulls cancel the throw (0 to 0.5, as a fraction: 0.01 = 1%): share of the longest pull
minPull=0.08
; Aim assist (0 to 1, as a fraction: 0.01 = 1%): pulls your throw toward the receiver nearest where you aim, and leads him
aimAssist=0.85
; Aim assist reach (1 to 15 yd)
aimAssistRange=7
; Throw preview dots (0 to 40): 0 = no preview
aimDots=14
; Flick length for a juke or dive (5 to 80 px)
flickMin=18
; Switch to the defender nearest the ball ("never", "throw", "always")
autoSwitch="throw"
; Field view ("sidelines", "zoom"): whole field: zoomed out to show the field from sideline to sideline
fieldView="sidelines"
; Zoomed in: yards across the screen (18 to 60 yd)
fieldZoom=34
; Field tilt (0.35 to 1): how flat the field looks: lower is flatter (and fits more when zoomed out)
fieldTilt=0.55
; Player size (zoomed in) (0.3 to 1.5 ×)
playerScale=0.62
; Player size (whole field) (0.3 to 2 ×): players drawn bigger than life, like the old games
playerScaleWide=0.85

; ---------- PLAYERS ----------
; Run speed (0.4 to 2 ×): everyone
runSpeed=1
; Acceleration (4 to 60 yd/s²)
accel=20
; Your player's speed boost (0.8 to 1.5 ×)
userSpeed=1.04
; Speed with the ball (0.6 to 1.2 ×)
carrySpeed=0.93
; Computer tacklers' pursuit speed (0.7 to 1.4 ×): chasing the ball carrier
pursuit=1.06
; Juke: how long the cut lasts (0.1 to 1 s)
jukeTime=0.3
; Juke: burst speed (1 to 3 ×)
jukeBurst=1.5
; Juke: tackles missed during the cut (0 to 1, as a fraction: 0.01 = 1%)
jukeEvade=0.7
; Juke: chance nearby tacklers stumble (0 to 1, as a fraction: 0.01 = 1%)
jukeFool=0.45
; Juke: wait before the next one (0 to 3 s)
jukeCooldown=0.8
; Dive tackle: how long the lunge lasts (0.1 to 1 s)
diveTime=0.35
; Dive tackle: lunge speed (1 to 3 ×)
diveBurst=1.6
; Dive tackle: reach (0.5 to 3 yd)
diveReach=1.6
; Dive tackle: time on the ground after (0 to 3 s)
diveDown=0.9
; Tackle reach (0.3 to 2 yd)
tackleReach=0.95
; Tackle chance (even matchup) (0 to 1, as a fraction: 0.01 = 1%)
tackleBase=0.72
; How much ratings change tackle chance (0 to 2)
tackleRating=0.6
; Extra tackle chance on a dive (0 to 1, as a fraction: 0.01 = 1%)
diveBonus=0.25
; Stumble after a missed tackle (0 to 2 s)
missStun=0.7
; How long blocks hold (0.2 to 4 ×)
blockHold=1
; Blocking reach (0.4 to 2 yd)
blockReach=1

; ---------- PASSING ----------
; Pass speed (8 to 40 yd/s): at an average arm
passSpeed=22
; Longest throw (20 to 80 yd)
maxThrow=55
; Pass arc height (0 to 0.4 per yd)
passArc=0.12
; Pass inaccuracy (0 to 3 ×)
passScatter=1
; Catch reach (0.4 to 3 yd)
catchReach=1.35
; Catch chance (open receiver) (0 to 1, as a fraction: 0.01 = 1%): plus his hands rating
catchBase=0.8
; Catch chance lost with a defender on him (0 to 1, as a fraction: 0.01 = 1%)
coverPenalty=0.55
; Interception chance for a defender at the ball (0 to 1, as a fraction: 0.01 = 1%)
intChance=0.35
; Computer QB throws when a man is this open (0.5 to 10 yd)
aiThrowOpen=3.5
; Computer QB throws by (1 to 8 s): after the snap
aiThrowBy=3.2

; ---------- KICKING ----------
; Average punt (20 to 70 yd)
puntDistance=42
; Field goal: sure thing up to (10 to 50 yd)
fgRange=28
; Field goal: chance lost per yard beyond that (0 to 0.1, as a fraction: 0.01 = 1%)
fgFalloff=0.019
; Extra point chance (0 to 1, as a fraction: 0.01 = 1%)
patChance=0.96
; Ball after a kickoff (1 to 50 yd line)
touchback=25

; ---------- COMPUTER ----------
; Rookie: computer ratings (-0.4 to 0)
aiEasy=-0.12
; All-Pro: computer ratings (0 to 0.4)
aiHard=0.1
; Computer runners juke (0 to 1, as a fraction: 0.01 = 1%): chance when a tackler closes in
aiJuke=0.2
; Computer goes for it on 4th and (0 to 5 yd or less): past midfield
aiGoFor4th=1.5
; Other games: average points (7 to 40)
simScore=20
